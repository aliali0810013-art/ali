<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ناين سوفت لإدارة المبيعات والمحاسبة والمخزون">
  <style>
    html, body { height: 100%; margin: 0; background: #f4f8fc; }
    #ninesoft-update-panel {
      position: fixed; z-index: 2147483647;
      right: max(10px, env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      direction: rtl; font-family: Arial, sans-serif;
      display: flex; align-items: center; gap: 6px;
    }
    #ninesoft-update-btn {
      border: 1px solid #cbd9ea; background: #fff; color: #123e78;
      border-radius: 999px; padding: 8px 11px; font-size: 12px;
      font-weight: 750; cursor: pointer; box-shadow: 0 3px 12px #0002;
    }
    #ninesoft-update-btn:disabled { opacity: .7; cursor: progress; }
    #ninesoft-update-status {
      max-width: 230px; padding: 8px 11px; border-radius: 10px;
      background: #152c50; color: #fff; font-size: 12px;
      box-shadow: 0 3px 12px #0003;
    }
    [hidden] { display: none !important; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ناين سوفت">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>ناين سوفت | NineSoft</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="ninesoft-update-panel" aria-label="تحديث نسخة ناين سوفت">
    <button type="button" id="ninesoft-update-btn"
      title="تحديث ملفات الواجهة مع الاحتفاظ بالفواتير غير المرسلة">
      &#8635; تحديث الإصدار
    </button>
    <span id="ninesoft-update-status" role="status" aria-live="polite" hidden></span>
  </div>
  <script src="ninesoft_update.js" defer></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

let current=0, query='', selectedMode=0;
function toast(msg){const e=document.getElementById('toast');e.textContent=msg||'هذا زر تجريبي؛ لا توجد عمليات حفظ أو ترحيل فعلي.';e.classList.add('visible');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('visible'),2800)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function goto(index){current=index;query='';selectedMode=0;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function actions(values){return `<div class="actions">${(values||[]).map((v,i)=>`<button class="btn ${i===0?'primary':i===1?'green':i===2?'':'purple'}" onclick="toast('${v}: وضع معاينة فقط')">${icon(i===0?'save':i===1?'check':i===2?'print':'file')}<span>${v}</span></button>`).join('')}</div>`}
function fields(values,heading){if(!values?.length)return '';return `<section class="card"><div class="card-head"><span class="ico">${icon('file')}</span>${heading||'بيانات المستند'}<span class="sub">يمكن تعديل القيم محليًا للعرض فقط</span></div><div class="field-grid">${values.map((v,i)=>`<div class="field"><label for="field${i}">${v.label}</label><div class="control">${icon(v.ic)}<input id="field${i}" value="${v.val.replace(/"/g,'&quot;')}" aria-label="${v.label}"><span class="drop">⌄</span></div></div>`).join('')}</div></section>`}
function metrics(values){if(!values?.length)return '';return `<div class="stats ${values.length===3?'three':''}">${values.map(x=>`<div class="stat"><div class="stat-head"><span>${x.label}</span>${icon(x.ic)}</div><div class="value">${x.val}</div><div class="detail">${x.detail||''}</div></div>`).join('')}</div>`}

function render(keepScroll=false){const s=screens[current];const scroll=window.scrollY;document.getElementById('sideNav').innerHTML=screens.map((x,i)=>`<button class="side-btn ${i===current?'active':''}" onclick="goto(${i})">${icon(x.icon)}<span>${x.title}</span><span class="num">${i+1}</span></button>`).join('');document.getElementById('bottomBar').innerHTML=[[0,'الرئيسية','home'],[3,'العمليات','stock'],[0,'','plus'],[10,'التقارير','chart'],[18,'الإعدادات','settings']].map(([i,label,ic],j)=>`<button class="${j===2?'add':current===i?'active':''}" onclick="goto(${i})">${icon(ic)}${label?`<span>${label}</span>`:''}</button>`).join('');const isReport=['reports','profit','trial','ledger'].includes(s.id);const beforeTable=['products','inventory','wasl','whatsapp','reports'].includes(s.id);document.getElementById('content').innerHTML=`<div class="page-title"><div class="symbol">${icon(s.icon)}</div><div><h1>${s.title}</h1><p>${s.hint}</p></div><div class="p-select"><select onchange="goto(Number(this.value))">${screens.map((x,i)=>`<option value="${i}" ${i===current?'selected':''}>${x.title}</option>`).join('')}</select></div></div>${s.search?search(s.search,['sales','purchases','returns','inventory'].includes(s.id)):''}${s.modes?modes(s.modes):''}${['suppliers','reports','profit','trial','banks','inventory','wasl','backup','users'].includes(s.id)?metrics(s.metrics):''}${s.fields?fields(s.fields,({'sales':'تحرير فاتورة مبيعات','purchases':'فاتورة مشتريات','customers':'إضافة / تعديل عميل','suppliers':'إضافة / تعديل مورد','products':'إضافة / تعديل صنف','accounts':'إضافة / تعديل حساب','journal':'إنشاء قيد يومية','users':'تفاصيل المستخدم'}[s.id]||'بيانات '+s.title)):''}${beforeTable?extra(s):''}${s.table?table(s.table):''}${!beforeTable?extra(s):''}${!['suppliers','reports','profit','trial','banks','inventory','wasl','backup','users'].includes(s.id)?metrics(s.metrics):''}${actions(s.actions)}<div class="banner">${icon('info')} <span>هذه <b>NineSoft Local UI Fast Preview</b> ببيانات عرض مؤقتة فقط. لا تحفظ أو ترسل أو تعدل قيودًا فعلية.</span></div>`;if(keepScroll)window.scrollTo(0,scroll)}
render();
</script>

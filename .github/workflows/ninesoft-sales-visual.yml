name: NineSoft Sales Visual Capture

on:
  push:
    branches: [ui-redesign]
    paths:
      - 'apps/nizami_app/lib/src/features/invoices/**'
      - 'apps/nizami_app/lib/src/features/navigation/ninesoft_workspace_shell.dart'
      - 'apps/nizami_app/lib/src/theme/ninesoft_entry_ui.dart'
      - 'apps/nizami_app/lib/src/theme/ninesoft_ui.dart'
      - 'apps/nizami_app/test/reference_screenshot_test.dart'
      - '.github/workflows/ninesoft-sales-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nizami_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture sales candidate
        run: timeout 120s flutter test test/reference_screenshot_test.dart --dart-define=NINESOFT_CAPTURE_SCREENSHOTS=true
      - name: Upload sales actual
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sales-candidate-actual
          if-no-files-found: error
          path: apps/nizami_app/test/captures/ninesoft-phone-sales.png
